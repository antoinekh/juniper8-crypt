[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juniper8-crypt"
version = "0.1.0"
description = "Python library and CLI to encrypt, decrypt, and compare Juniper $8$ (type 8) passwords"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Antoine Keranflec'h", email = "antoine.keranflech@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["juniper", "junos", "password", "crypt", "decrypt", "network", "$8$", "aes256-gcm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/antoinekh/juniper8-crypt"
Repository = "https://github.com/antoinekh/juniper8-crypt"
Issues = "https://github.com/antoinekh/juniper8-crypt/issues"

[project.scripts]
juniper8-crypt = "juniper8_crypt:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["juniper8_crypt"]

[tool.hatch.build.targets.sdist]
include = ["juniper8_crypt/", "README.md", "LICENSE", "tests/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
